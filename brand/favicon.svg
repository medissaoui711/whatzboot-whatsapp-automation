<svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- 
      WhatzBoot Favicon
      Concept: A simplified, squared-off version of the logo focusing on the most
      recognizable element (the robot head) for clarity at small sizes.
    -->
    <title>WhatzBoot Favicon</title>
    <!-- Square background with rounded corners -->
    <rect width="100" height="100" rx="16" fill="#16A34A"/>
    
    <!-- Robot Head (centered and enlarged for visibility) -->
    <rect x="30" y="32" width="40" height="28" rx="7" fill="white"/>
    
    <!-- Robot Eyes -->
    <circle cx="43" cy="46" r="4.5" fill="#16A34A"/>
    <circle cx="57" cy="46" r="4.5" fill="#16A34A"/>
    
    <!-- Robot Antenna -->
    <line x1="50" y1="32" x2="50" y2="22" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="19" r="3" fill="white"/>
</svg>
