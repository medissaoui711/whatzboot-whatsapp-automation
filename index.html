<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatzBoot - WhatsApp Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'whatsapp-green': '#25D366',
              'whatsapp-teal-green': '#128C7E',
              'whatsapp-light-green': '#DCF8C6',
              'whatsapp-blue': '#34B7F1',
              'dark-bg': '#0D1117',
              'dark-card': '#161B22',
              'dark-border': '#30363d',
              'dark-text-primary': '#c9d1d9',
              'dark-text-secondary': '#8b949e',
              'dark-input': '#010409',
            },
             keyframes: {
              'toast-in-right': {
                'from': { transform: 'translateX(100%)', opacity: '0' },
                'to': { transform: 'translateX(0)', opacity: '1' },
              },
              'toast-in-left': {
                'from': { transform: 'translateX(-100%)', opacity: '0' },
                'to': { transform: 'translateX(0)', opacity: '1' },
              },
              'toast-out': {
                'from': { transform: 'translateX(0)', opacity: '1' },
                'to': { transform: 'translateX(120%)', opacity: '0' },
              }
            },
            animation: {
              'toast-in-right': 'toast-in-right 0.5s ease-out forwards',
              'toast-in-left': 'toast-in-left 0.5s ease-out forwards',
              'toast-out': 'toast-out 0.5s ease-in forwards',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
      [lang="ar"] body, [lang="ar"] button, [lang="ar"] input, [lang="ar"] textarea, [lang="ar"] select {
        font-family: 'Tajawal', sans-serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.4",
    "recharts": "https://aistudiocdn.com/recharts@^3.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0"
  }
}
</script>
</head>
  <body class="bg-dark-bg text-dark-text-primary">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
